name: Generate Stats Images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and render
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          mkdir -p out
          cd src
          python collect.py > ../out/result_v2.json 2> ../out/collect.log
          python recompute.py ../out/result_v2.json > ../out/result_clean.json
          python render.py ../out/result_clean.json ../out

      - name: Push to generated branch
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          cd out
          git init -q -b generated
          git config user.name "github-stats-bot"
          git config user.email "github-stats-bot@users.noreply.github.com"
          git add overview.svg languages.svg result_clean.json result_v2.json
          git commit -q -m "Update stats $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" generated
